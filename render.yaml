services:
  - type: web
    name: crypto-paper-bot-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-cloud.txt && pip install -e .
    startCommand: uvicorn crypto_paper_bot.api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: render
      - key: MIN_API_INTERVAL_SECONDS
        value: "60"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BINANCE_ENABLE_LIVE_TRADING
        value: "false"
      - key: BINANCE_ENABLE_WITHDRAWALS
        value: "false"

  - type: worker
    name: crypto-paper-bot-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-cloud.txt && pip install -e .
    startCommand: python -m crypto_paper_bot.worker
    envVars:
      - key: APP_ENV
        value: render
      - key: MIN_API_INTERVAL_SECONDS
        value: "300"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BINANCE_ENABLE_LIVE_TRADING
        value: "false"
      - key: BINANCE_ENABLE_WITHDRAWALS
        value: "false"
