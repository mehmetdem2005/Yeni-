[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-paper-bot"
version = "0.1.0"
description = "Spot-only long-only crypto paper trading bot core v1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crypto-paper-bot = "crypto_paper_bot.cli:main"
crypto-paper-bot-app = "crypto_paper_bot.app:main"
crypto-paper-bot-worker = "crypto_paper_bot.worker:main"

[project.optional-dependencies]
termux = []
config = ["PyYAML>=6.0.1"]
market = ["ccxt>=4.4.0"]
db = ["SQLAlchemy>=2.0.0", "psycopg[binary]>=3.1.0"]
ml = ["numpy>=1.26.0", "pandas>=2.2.0", "scikit-learn>=1.4.0"]
cloud = ["gunicorn>=22.0.0"]
llm = ["requests>=2.32.0"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0", "mypy>=1.10.0"]
all = [
  "PyYAML>=6.0.1",
  "ccxt>=4.4.0",
  "SQLAlchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "gunicorn>=22.0.0",
  "requests>=2.32.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
