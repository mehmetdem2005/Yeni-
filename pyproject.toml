[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-paper-bot"
version = "0.1.0"
description = "Spot-only long-only crypto paper trading bot core v1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crypto-paper-bot = "crypto_paper_bot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
ml = ["numpy>=1.26.0", "pandas>=2.2.0", "scikit-learn>=1.4.0"]
market = ["ccxt>=4.4.0"]
config = ["PyYAML>=6.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
